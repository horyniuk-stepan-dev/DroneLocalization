# CI: лінт + юніт-тести без GPU-залежностей.
# Важкі тести (torch/ultralytics/PyQt6/бенчмарки) виключені — вони потребують
# GPU/дисплей і запускаються локально: pytest tests/
name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ruff
        run: pip install "ruff==0.16.1"  # той самий пін, що у .pre-commit-config.yaml
      - name: Ruff check
        run: ruff check src/ config/ tests/
      - name: Ruff format check
        run: ruff format --check src/ config/ tests/

  types:
    # mypy strict на вже повністю типізованих модулях (список — [tool.mypy]
    # files у pyproject.toml). Конфіг існував давно, але CI його не викликав,
    # тож гейт мовчав; модулі онбордяться в цей список по одному.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install mypy and typed deps
        run: pip install mypy numpy'<2.0.0' pydantic loguru
      - name: Mypy (strict, onboarded modules only)
        run: mypy

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install test dependencies (CPU-only, без torch)
        run: |
          pip install numpy'<2.0.0' scipy opencv-python-headless pyproj \
            pydantic loguru orjson filterpy pytest pytest-cov \
            cryptography h5py PyQt6 lancedb aiohttp websockets
      - name: Run unit tests
        run: |
          pytest tests/ -q \
            --ignore=tests/benchmarks \
            --ignore=tests/integration \
            --ignore=tests/unit \
            --ignore=tests/test_localization.py \
            --ignore=tests/test_rdd.py \
            --ignore=tests/test_object_tracker.py \
            --deselect=tests/test_hardware_profile.py::TestApplyTorchBackends::test_sets_thread_counts \
            --deselect=tests/test_localization_characterization.py::test_characterization_matches_baseline \
            -p no:cacheprovider
