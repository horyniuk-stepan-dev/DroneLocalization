<!DOCTYPE html>
<html>
<head>
    <title>Drone Tracker Map</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Leaflet 1.9.4 vendored locally so the map works offline -->
    <link rel="stylesheet" href="vendor/leaflet/leaflet.css" />
    <script src="vendor/leaflet/leaflet.js"></script>
    <link rel="stylesheet" href="map_tools.css" />
    <script src="map_tools.js"></script>
    <script src="qrc:///qtwebchannel/qwebchannel.js"></script>
    <style>
        body, html { padding: 0; margin: 0; height: 100%; overflow: hidden; background: #1a1a2e; }
        #map { position: absolute; inset: 0; }
        #error-log {
            position: absolute; top: 10px; left: 50px; z-index: 9999;
            color: red; background: white; padding: 10px; display: none;
            font-weight: bold; border: 2px solid red; max-width: 60%;
            word-break: break-word;
        }
    </style>
</head>
<body>
    <div id="error-log"></div>
    <div id="map"></div>

    <script>
        // ── Global error display (useful inside QWebEngineView) ─────────────
        window.onerror = function(msg, source, line) {
            var el = document.getElementById('error-log');
            el.innerHTML = "JS Error: " + msg + " (" + source + ":" + line + ")";
            el.style.display = 'block';
        };

        // ── L.ImageOverlay.Rotated plugin (inlined to avoid CDN blocking) ───
        L.ImageOverlay.Rotated = L.ImageOverlay.extend({
            initialize: function(image, topleft, topright, bottomleft, options) {
                this._url = image;
                this._topLeft    = L.latLng(topleft);
                this._topRight   = L.latLng(topright);
                this._bottomLeft = L.latLng(bottomleft);
                L.setOptions(this, options);
            },
            onAdd: function(map) {
                if (!this._image) {
                    this._initImage();
                    if (this.options.opacity < 1)
                        L.DomUtil.setOpacity(this._image, this.options.opacity);
                }
                map.getPanes().overlayPane.appendChild(this._image);
                map.on('viewreset', this._reset, this);
                if (map.options.zoomAnimation && L.Browser.any3d)
                    map.on('zoomanim', this._animateZoom, this);
                this._reset();
            },
            onRemove: function(map) {
                map.getPanes().overlayPane.removeChild(this._image);
                map.off('viewreset', this._reset, this);
                if (map.options.zoomAnimation)
                    map.off('zoomanim', this._animateZoom, this);
            },
            _initImage: function() {
                var img = this._image = L.DomUtil.create('img', 'leaflet-image-layer');
                img.style.position    = 'absolute';
                img.style.transformOrigin = '0 0';
                img.onload = () => this._reset();
                img.src = this._url;
            },
            _reset: function() {
                // Guard against zero dimensions during async image load
                if (!this._image ||
                    this._image.width  === 0 ||
                    this._image.height === 0) return;

                var p = this._map.latLngToLayerPoint(this._topLeft),
                    q = this._map.latLngToLayerPoint(this._topRight),
                    r = this._map.latLngToLayerPoint(this._bottomLeft);
                var W = this._image.width, H = this._image.height;
                this._image.style.transform =
                    'matrix(' +
                    ((q.x-p.x)/W) + ',' + ((q.y-p.y)/W) + ',' +
                    ((r.x-p.x)/H) + ',' + ((r.y-p.y)/H) + ',' +
                    p.x + ',' + p.y + ')';
            },
            _animateZoom: function(e) {
                if (!this._image ||
                    this._image.width  === 0 ||
                    this._image.height === 0) return;

                var p = this._map._latLngToNewLayerPoint(this._topLeft,    e.zoom, e.center),
                    q = this._map._latLngToNewLayerPoint(this._topRight,   e.zoom, e.center),
                    r = this._map._latLngToNewLayerPoint(this._bottomLeft, e.zoom, e.center);
                var W = this._image.width, H = this._image.height;
                this._image.style.transform =
                    'matrix(' +
                    ((q.x-p.x)/W) + ',' + ((q.y-p.y)/W) + ',' +
                    ((r.x-p.x)/H) + ',' + ((r.y-p.y)/H) + ',' +
                    p.x + ',' + p.y + ')';
            }
        });
        L.imageOverlay.rotated = function(src, tl, tr, bl, opts) {
            return new L.ImageOverlay.Rotated(src, tl, tr, bl, opts);
        };

        // ── Map init ─────────────────────────────────────────────────────────
        var map = L.map('map').setView([48.3794, 31.1656], 6);

        var satellite = L.tileLayer(
            'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
            { attribution: 'Tiles © Esri', maxZoom: 20 }
        );
        var osm = L.tileLayer(
            'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
            { attribution: '© OpenStreetMap contributors', maxZoom: 19 }
        );
        satellite.addTo(map);
        L.control.layers({ "Супутник (Esri)": satellite, "OpenStreetMap": osm }).addTo(map);

        // ── State ─────────────────────────────────────────────────────────────
        var droneMarker      = null;
        var trajectoryLine   = L.polyline([], { color: 'red',    weight: 3 }).addTo(map);
        var fovPolygon       = L.polygon([], { color: '#00ff00', weight: 2, fillOpacity: 0.15 }).addTo(map);
        var panoramaOverlay  = null;
        var verificationMarkers = L.layerGroup().addTo(map);
        var objectMarkersLayer = L.layerGroup().addTo(map);
        var manualTargetsLayer = L.layerGroup().addTo(map);
        // Map coverage outline (localization.coverage) + return line when outside
        var coverageLayer = L.layerGroup().addTo(map);
        var coverageReturnLine = L.polyline([], { color: '#ff1744', weight: 2, dashArray: '4 6' }).addTo(map);
        var COVERAGE_COLORS = {
            inside: '#00e5ff', near_edge: '#ffb300', leaving: '#ff6d00',
            outside: '#ff1744', lost_inside: '#ab47bc', unknown: '#9e9e9e'
        };

        // ── Bridge functions ──────────────────────────────────────────────────
        function setCoverage(json) {
            coverageLayer.clearLayers();
            var rings = JSON.parse(json || '[]');
            rings.forEach(function(r) {
                L.polygon(r, { color: COVERAGE_COLORS.inside, weight: 2, dashArray: '8 6',
                               fill: false, interactive: false }).addTo(coverageLayer);
            });
        }

        function setCoverageState(json) {
            var s = JSON.parse(json || '{}');
            var color = COVERAGE_COLORS[s.state] || COVERAGE_COLORS.unknown;
            coverageLayer.eachLayer(function(l) { l.setStyle({ color: color }); });
            if (s.from && s.to) {
                coverageReturnLine.setLatLngs([s.from, s.to]);
            } else {
                coverageReturnLine.setLatLngs([]);
            }
        }

        function updateMarker(lat, lon) {
            var pos = new L.LatLng(lat, lon);
            if (droneMarker === null) {
                droneMarker = L.marker(pos).addTo(map);
                map.setView(pos, 18);
            } else {
                droneMarker.setLatLng(pos);
                map.panTo(pos);
            }
        }

        function addTrajectoryPoint(lat, lon) {
            trajectoryLine.addLatLng([lat, lon]);
        }

        function updateFOV(lat1, lon1, lat2, lon2, lat3, lon3, lat4, lon4) {
            fovPolygon.setLatLngs([
                [lat1, lon1], [lat2, lon2], [lat3, lon3], [lat4, lon4]
            ]);
        }

        function clearTrajectory() {
            trajectoryLine.setLatLngs([]);
            fovPolygon.setLatLngs([]);
            if (droneMarker !== null) {
                map.removeLayer(droneMarker);
                droneMarker = null;
            }
            if (panoramaOverlay !== null) {
                map.removeLayer(panoramaOverlay);
                panoramaOverlay = null;
            }
            if (verificationMarkers) {
                verificationMarkers.clearLayers();
            }
            resetNodeDrag();
            if (objectMarkersLayer) {
                objectMarkersLayer.clearLayers();
            }
            if (manualTargetsLayer) {
                manualTargetsLayer.clearLayers();
            }
        }

        function setPanoramaOverlay(
            dataUrl,
            lat_tl, lon_tl,
            lat_tr, lon_tr,
            lat_br, lon_br,   // used only for fitBounds; plugin derives BR from TL+TR+BL
            lat_bl, lon_bl
        ) {
            try {
                if (panoramaOverlay !== null) {
                    map.removeLayer(panoramaOverlay);
                    panoramaOverlay = null;
                }
                panoramaOverlay = L.imageOverlay.rotated(
                    dataUrl,
                    L.latLng(lat_tl, lon_tl),
                    L.latLng(lat_tr, lon_tr),
                    L.latLng(lat_bl, lon_bl),
                    { opacity: 0.75, interactive: false }
                ).addTo(map);

                map.fitBounds(L.latLngBounds([
                    [lat_tl, lon_tl], [lat_tr, lon_tr],
                    [lat_br, lon_br], [lat_bl, lon_bl]
                ]));

                document.getElementById('error-log').style.display = 'none';
            } catch(e) {
                var el = document.getElementById('error-log');
                el.innerHTML = "Помилка панорами: " + e.message;
                el.style.display = 'block';
            }
        }

        // ── Draggable frame markers (georeferenced local map) ────────────────
        // A marker is the centre of one video frame. Grabbing it asks Python
        // for the frame image, which is drawn semi-transparent on the frame's
        // ground footprint and moves with the marker; the marker or the image
        // can be dragged. Dropping reports the new centre to Python, which
        // re-fits the frame graph and sends all markers again.
        var NODE_GHOST_OPACITY = 0.55;
        var NODE_SNAP_PX = 18;        // drop a marker onto a 📍 point -> its exact place
        var nodeBridge = null;        // set when the web channel connects
        var nodeMarkers = {};         // frame label -> circleMarker
        var nodeDrag = null;          // drag in progress
        var nodeGhost = null;         // {label, base, overlay, corners: [TL, TR, BL]}
        var nodeDragEndedAt = 0;

        function nodeDragJustEnded() { return Date.now() - nodeDragEndedAt < 300; }

        function clearNodeGhost() {
            if (nodeGhost && nodeGhost.overlay) map.removeLayer(nodeGhost.overlay);
            nodeGhost = null;
        }

        function resetNodeDrag() {
            if (nodeDrag) {
                map.removeLayer(nodeDrag.line);
                map.dragging.enable();
                nodeDrag = null;
            }
            clearNodeGhost();
            nodeMarkers = {};
        }

        // `ll` moved by the same screen offset that takes `from` to `to`
        function shiftedLatLng(ll, from, to) {
            var z = map.getZoom();
            return map.unproject(
                map.project(ll, z).add(map.project(to, z).subtract(map.project(from, z))), z);
        }

        function placeNodeGhost(center) {
            var g = nodeGhost;
            if (!g || !g.overlay) return;
            g.overlay._topLeft    = shiftedLatLng(g.corners[0], g.base, center);
            g.overlay._topRight   = shiftedLatLng(g.corners[1], g.base, center);
            g.overlay._bottomLeft = shiftedLatLng(g.corners[2], g.base, center);
            g.overlay._reset();
        }

        function snapToUserPoint(ll) {
            var feats = (window.mapTools && window.mapTools.features) || [];
            var p = map.latLngToContainerPoint(ll), best = null, bestD = NODE_SNAP_PX;
            feats.forEach(function(f) {
                if (f.type !== 'point') return;
                var q = L.latLng(f.coords[0][0], f.coords[0][1]);
                var d = map.latLngToContainerPoint(q).distanceTo(p);
                if (d < bestD) { bestD = d; best = q; }
            });
            return best || ll;
        }

        function beginNodeDrag(label, ev, viaImage) {
            var m = nodeMarkers[label];
            if (!m || nodeDrag || !nodeBridge) return;
            if (window.mapTools && window.mapTools.isBusy()) return;  // a drawing tool owns the mouse
            map.dragging.disable();
            var origin = m.getLatLng();
            nodeDrag = {
                label: label, marker: m, origin: origin, viaImage: viaImage, moved: false,
                grab: map.mouseEventToLatLng(ev),
                start: L.point(ev.clientX, ev.clientY),
                line: L.polyline([origin, origin], {
                    color: '#ffeb3b', weight: 2, dashArray: '5 5', interactive: false
                }).addTo(map)
            };
            if (!nodeGhost || nodeGhost.label !== label) {
                clearNodeGhost();
                nodeGhost = { label: label, base: origin, overlay: null, corners: null };
                nodeBridge.requestNodeFrame(label);
            }
        }

        function setNodeFrame(label, dataUrl, cornersJson) {
            var m = nodeMarkers[label];
            if (!m || !nodeGhost || nodeGhost.label !== label || nodeGhost.overlay) return;
            var c = JSON.parse(cornersJson).map(function(p) { return L.latLng(p[0], p[1]); });
            var overlay = L.imageOverlay.rotated(dataUrl, c[0], c[1], c[3],
                                                 { opacity: NODE_GHOST_OPACITY }).addTo(map);
            nodeGhost.overlay = overlay;
            nodeGhost.corners = [c[0], c[1], c[3]];
            var img = overlay._image;
            img.style.pointerEvents = 'auto';
            img.style.cursor = 'move';
            img.title = 'Кадр ' + label + ': тягніть, щоб поставити на місце · клік — сховати';
            img.draggable = false;
            L.DomEvent.on(img, 'mousedown', function(ev) {
                if (ev.button !== 0) return;
                L.DomEvent.stop(ev);
                beginNodeDrag(label, ev, true);
            });
            L.DomEvent.on(img, 'click dblclick', L.DomEvent.stop);
            img.addEventListener('load', function() { placeNodeGhost(m.getLatLng()); });
            placeNodeGhost(m.getLatLng());
        }

        document.addEventListener('mousemove', function(ev) {
            var d = nodeDrag;
            if (!d) return;
            if (!d.moved && L.point(ev.clientX, ev.clientY).distanceTo(d.start) < 4) return;
            d.moved = true;
            var at = shiftedLatLng(d.origin, d.grab, map.mouseEventToLatLng(ev));
            d.marker.setLatLng(at);
            d.line.setLatLngs([d.origin, at]);
            placeNodeGhost(at);
        });

        document.addEventListener('mouseup', function() {
            var d = nodeDrag;
            if (!d) return;
            nodeDrag = null;
            map.dragging.enable();
            map.removeLayer(d.line);
            nodeDragEndedAt = Date.now();
            if (!d.moved) {
                // plain click: on the marker -> keep the frame shown; on the frame -> hide it
                if (d.viaImage) clearNodeGhost();
                return;
            }
            var at = d.marker.getLatLng();
            if (!d.viaImage) {  // aligning by the image is exact work: no snapping
                at = snapToUserPoint(at);
                d.marker.setLatLng(at);
                placeNodeGhost(at);
            }
            nodeBridge.verificationNodeMoved(d.label, at.lat, at.lng);
        });

        document.addEventListener('keydown', function(ev) {
            if (ev.key !== 'Escape') return;
            var d = nodeDrag;
            if (d) {  // cancel the drag: everything back to where it was
                nodeDrag = null;
                map.dragging.enable();
                map.removeLayer(d.line);
                d.marker.setLatLng(d.origin);
                placeNodeGhost(d.origin);
                nodeDragEndedAt = Date.now();
            } else {
                clearNodeGhost();
            }
        });

        map.on('zoomend', function() {
            if (nodeGhost && nodeGhost.overlay) nodeGhost.overlay._reset();
        });

        function showVerificationMarkers(pointsJson) {
            verificationMarkers.clearLayers();
            resetNodeDrag();
            // Either a plain list of points or {points, fit, draggable}
            var data = JSON.parse(pointsJson);
            var opts = Array.isArray(data) ? {} : data;
            var points = Array.isArray(data) ? data : (data.points || []);
            var draggable = !!opts.draggable;

            // Under the markers and not interactive, so it never takes their mouse events
            if (points.length > 1) {
                var lineCoords = points.map(p => [p.lat, p.lon]);
                var polyline = L.polyline(lineCoords, {
                    color: '#00ff00', weight: 2, opacity: 0.8, interactive: false
                });
                verificationMarkers.addLayer(polyline);
            }

            points.forEach(p => {
                var m = L.circleMarker([p.lat, p.lon], {
                    radius: draggable ? 6 : 4,
                    color: p.pinned ? '#ffeb3b' : '#ffffff',
                    weight: p.pinned ? 3 : 1,
                    fillColor: p.color || '#007bff',
                    fillOpacity: 0.8
                });
                if (p.label && p.label !== "") {
                    m.bindTooltip(p.label.toString(), {
                        permanent: true,
                        direction: 'top',
                        className: 'marker-label'
                    });
                    if (draggable) {
                        var label = p.label.toString();
                        nodeMarkers[label] = m;
                        m.on('mousedown', function(e) {
                            if (e.originalEvent.button !== 0) return;
                            L.DomEvent.preventDefault(e.originalEvent);
                            beginNodeDrag(label, e.originalEvent, false);
                        });
                    }
                }
                verificationMarkers.addLayer(m);
            });

            if (points.length > 0 && opts.fit !== false) {
                var bounds = L.latLngBounds(points.map(p => [p.lat, p.lon]));
                map.fitBounds(bounds);
            }
        }

        function clearVerificationMarkers() {
            verificationMarkers.clearLayers();
            resetNodeDrag();
        }

        function updateObjectMarkers(pointsJson) {
            objectMarkersLayer.clearLayers();
            var points = JSON.parse(pointsJson);
            points.forEach(p => {
                var colorMap = {
                    'person': '#ff6464',
                    'car': '#64c8ff',
                    'motorcycle': '#ffc832',
                    'bus': '#32ff64',
                    'truck': '#ff9632'
                };
                var markerColor = colorMap[p.class_name] || '#aaaaaa';
                var m = L.circleMarker([p.lat, p.lon], {
                    radius: 6,
                    color: '#ffffff',
                    weight: 1,
                    fillColor: markerColor,
                    fillOpacity: 0.8
                });
                m.bindTooltip(p.label, {
                    permanent: true,
                    direction: 'top',
                    className: 'marker-label'
                });
                objectMarkersLayer.addLayer(m);
            });
        }

        function updateManualTargets(json) {
            manualTargetsLayer.clearLayers();
            JSON.parse(json).forEach(t => {
                if (t.trail && t.trail.length > 1) {
                    manualTargetsLayer.addLayer(L.polyline(t.trail, {
                        color: '#00e676', weight: 2, opacity: 0.8, dashArray: '4 4'
                    }));
                }
                if (t.lat === null || t.lat === undefined) return;
                var m = L.circleMarker([t.lat, t.lon], {
                    radius: 8,
                    color: '#ffffff',
                    weight: 2,
                    fillColor: t.lost ? '#ff9800' : '#00e676',
                    fillOpacity: 0.9
                });
                m.bindTooltip(t.label, {permanent: true, direction: 'top', className: 'marker-label'});
                manualTargetsLayer.addLayer(m);
            });
        }

        function toggleObjectMarkers(show) {
            if (show) {
                if (!map.hasLayer(objectMarkersLayer)) {
                    map.addLayer(objectMarkersLayer);
                }
            } else {
                if (map.hasLayer(objectMarkersLayer)) {
                    map.removeLayer(objectMarkersLayer);
                }
            }
        }

        // ── QWebChannel init with retry ───────────────────────────────────────
        // DOMContentLoaded fires before Qt injects `qt.webChannelTransport`
        // → poll with retries instead of a one-shot check
        function initWebChannel(retriesLeft) {
            if (typeof qt !== 'undefined' && qt.webChannelTransport) {
                new QWebChannel(qt.webChannelTransport, function(channel) {
                    var bridge = channel.objects.mapBridge;
                    bridge.updateMarkerSignal.connect(updateMarker);
                    bridge.addTrajectorySignal.connect(addTrajectoryPoint); // matches MapBridge
                    bridge.clearTrajectorySignal.connect(clearTrajectory);
                    bridge.updateFOVSignal.connect(updateFOV);
                    bridge.setPanoramaSignal.connect(setPanoramaOverlay);
                    bridge.showVerificationMarkersSignal.connect(showVerificationMarkers);
                    bridge.clearVerificationMarkersSignal.connect(clearVerificationMarkers);
                    bridge.updateObjectMarkersSignal.connect(updateObjectMarkers);
                    bridge.toggleObjectMarkersSignal.connect(toggleObjectMarkers);
                    bridge.updateManualTargetsSignal.connect(updateManualTargets);
                    bridge.setCoverageSignal.connect(setCoverage);
                    bridge.setCoverageStateSignal.connect(setCoverageState);
                    bridge.nodeFrameSignal.connect(setNodeFrame);
                    nodeBridge = bridge;

                    // ── User map tools (point / area / ruler ...) ─────────────
                    var tools = new MapTools(map, bridge);
                    window.mapTools = tools;
                    bridge.loadFeaturesSignal.connect(function(json) { tools.loadFeatures(json); });
                    bridge.rulerMeasuredSignal.connect(function(text) { tools.setRulerText(text); });

                    // ── JS -> Python: Notify on map click ─────────────────────
                    map.on('click', function(e) {
                        if (tools.isBusy()) return;  // a drawing tool owns the click
                        if (nodeDragJustEnded()) return;  // the click that ends a marker drag
                        bridge.mapClicked(e.latlng.lat, e.latlng.lng);
                    });

                    console.log("QWebChannel bridge connected");
                    bridge.ready("GEOGRAPHIC");
                });
            } else if (retriesLeft > 0) {
                setTimeout(function() { initWebChannel(retriesLeft - 1); }, 100);
            } else {
                console.error("QWebChannel: qt.webChannelTransport not available after retries");
                document.getElementById('error-log').innerHTML =
                    "QWebChannel не підключився. Перезавантажте застосунок.";
                document.getElementById('error-log').style.display = 'block';
            }
        }

        document.addEventListener("DOMContentLoaded", function() {
            initWebChannel(20);   // 20 × 100ms = 2s max wait
        });
    </script>
</body>
</html>
